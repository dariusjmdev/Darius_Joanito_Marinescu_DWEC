<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabla videojuegos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="menu">
        <ul id="menu-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="trabajo1.html">Trabajo 1</a></li>
            <li><a href="reto2.html">Reto 2</a></li>
            <li><a href="bucles.html">Bucles</a></li>
            <li><a href="personaje.html">Personaje</a></li>
            <li><button id="modoNoche">Modo Noche</button></li>
        </ul>
    </nav>
    <table id="tablaVideojuegos">
        <thead>
            <tr>
                <th>Título</th>
                <th>Compañía</th>
                <th>Plataforma</th>
                <th>Valoración</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>
    <form id="formulario">
        <input type="text" id="titulo" placeholder="Título del videojuego" required>
        <input type="text" id="compania" placeholder="Compañía" required>
        <input type="text" id="plataforma" placeholder="Plataforma" required>
        <input type="number" id="valoracion" placeholder="Valoración" min="0" max="10" step="1" required>
        <input type="float" id="precio" placeholder="Precio" min="0" step="5" required>
        <button type="submit">Añadir videojuego</button>
    </form>
<script src="app.js"></script>
</body>
</html>
